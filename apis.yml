name: Omnea
description: >-
  Omnea is an AI-native procurement platform that automates the full source-to-pay
  (S2P) process, unifying intake management, strategic sourcing, third-party risk
  management, and supplier management behind autonomous agents. Buyers raise
  requests conversationally through Slack, Microsoft Teams, or an OAuth-protected
  remote MCP (Model Context Protocol) server, and Omnea routes intelligent
  workflows, price-intelligence benchmarking, continuous supplier monitoring, and
  automated approvals. The company is backed by Accel, Insight Partners, and
  Point Nine, and exposes a documented public REST API plus a hosted MCP endpoint
  for agent integrations. Added to the API Evangelist network from VC-portfolio
  discovery and enriched from live probes of its public surfaces.
